# =============================================================================
# ISSUEOPS AGENT HUB — Continuous Coding Workflow
# =============================================================================
# Triggered when an issue is labeled "agent-run". Spins up a 3-hour Ubuntu
# runner that reads issue comments, drives Aider for code generation, pushes
# to a freshly-created repo, deploys to Vercel, and polls for follow-up
# instructions until timeout or the "!stop" kill switch.
# =============================================================================

name: "IssueOps Agent — Continuous Coding"

# ---------------------------------------------------------------------------
# Trigger: only when an issue receives the "agent-run" label.
# ---------------------------------------------------------------------------
on:
  issues:
    types: [labeled]

jobs:
  agent-session:
    # Only fire when:
    #   1. The label is exactly "agent-run"
    #   2. The actor (person who labeled) is mynameisgrass
    if: >-
      github.event.label.name == 'agent-run'
      && github.actor == 'mynameisgrass'

    runs-on: ubuntu-latest

    # Link to the "prod" environment where the 4 secrets are stored
    environment: prod

    # Hard ceiling — GitHub will kill the runner after 3 hours
    timeout-minutes: 180

    # -----------------------------------------------------------------------
    # Expose every secret the orchestrator needs as env vars so Bash scripts
    # can reference them without Actions expression syntax.
    # -----------------------------------------------------------------------
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      REPO_OWNER: ${{ github.repository_owner }}
      HUB_REPO: ${{ github.repository }}

    steps:
      # =====================================================================
      # 0. EARLY FEEDBACK — Post a comment BEFORE any tool setup so the user
      #    knows the workflow was triggered, even if later steps fail.
      #    Uses raw curl so we don't depend on gh being authenticated yet.
      # =====================================================================
      - name: "📡 Post early status to issue"
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$HUB_REPO/issues/$ISSUE_NUMBER/comments" \
            -d "$(jq -n --arg body "⏳ **Agent starting...**

          Workflow triggered by \`${{ github.actor }}\`. Setting up the environment now.

          | Step | Status |
          |------|--------|
          | Checkout | 🔄 |
          | Node.js + Python | 🔄 |
          | Aider + Vercel CLI | 🔄 |
          | GitHub auth | 🔄 |
          | Orchestrator | 🔄 |

          _This comment confirms the runner is live. If you don't see a follow-up within ~2 minutes, check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})._" '{body: $body}')"

      # =====================================================================
      # 1. CHECKOUT — pull the hub repo so we have scripts/ available
      # =====================================================================
      - name: "📥 Checkout hub repository"
        uses: actions/checkout@v4

      # =====================================================================
      # 2. NODE.JS — required for Vercel CLI
      # =====================================================================
      - name: "🟢 Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # =====================================================================
      # 3. PYTHON — required for Aider
      # =====================================================================
      - name: "🐍 Setup Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # =====================================================================
      # 4. INSTALL DEPENDENCIES
      # =====================================================================
      - name: "📦 Install Python dependencies (Aider)"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "📦 Install Vercel CLI"
        run: npm install -g vercel@latest

      # =====================================================================
      # 5. AUTHENTICATE TOOLS
      # =====================================================================
      - name: "🔑 Verify GitHub CLI authentication"
        run: |
          # gh automatically reads GH_TOKEN from the environment for all
          # API calls — no explicit login needed.  Just verify it works.
          echo "Authenticated as: $(gh api user --jq '.login')"

      - name: "🔑 Verify Vercel authentication"
        run: |
          # A quick whoami confirms the token works before we enter the loop.
          vercel whoami --token "$VERCEL_TOKEN"

      # =====================================================================
      # 6. UPDATE STATUS — Everything is ready, tell the user
      # =====================================================================
      - name: "✅ Post setup-complete status"
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$HUB_REPO/issues/$ISSUE_NUMBER/comments" \
            -d "$(jq -n --arg body "✅ **Environment ready!** Launching orchestrator now...

          | Step | Status |
          |------|--------|
          | Checkout | ✅ |
          | Node.js + Python | ✅ |
          | Aider + Vercel CLI | ✅ |
          | GitHub auth | ✅ |
          | Orchestrator | 🚀 launching... |" '{body: $body}')"

      # =====================================================================
      # 7. RUN THE ORCHESTRATOR
      # =====================================================================
      - name: "🤖 Launch orchestrator"
        run: |
          chmod +x scripts/orchestrator.sh scripts/github_api.sh
          bash scripts/orchestrator.sh

      # =====================================================================
      # 8. FAILURE HANDLER — If any step above fails, post an error comment
      #    so the user isn't left wondering what happened.
      # =====================================================================
      - name: "❌ Report failure to issue"
        if: failure()
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$HUB_REPO/issues/$ISSUE_NUMBER/comments" \
            -d "$(jq -n --arg body "❌ **Agent setup failed.**

          Something went wrong during environment setup. Check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.

          Common fixes:
          - Ensure all 4 secrets are configured (\`GH_PAT\`, \`VERCEL_TOKEN\`, \`GEMINI_API_KEY\`, \`GROQ_API_KEY\`)
          - Verify your \`GH_PAT\` has the required permissions (see README)
          - Re-apply the \`agent-run\` label to retry" '{body: $body}')"
